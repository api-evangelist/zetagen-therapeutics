aid: zetagen-therapeutics
name: Zetagen Therapeutics
description: >-
  Zetagen Therapeutics is a private, clinical-stage biopharmaceutical company founded in 2015 and
  based in Syracuse, New York, where it has operated from laboratory space in the Central New York
  Biotech Accelerator at SUNY Upstate Medical University since 2017. It develops locally
  administered small-molecule therapies for metastatic and primary cancers to bone and other organs,
  built on a proprietary "Zeta" platform derived from the company's discovery of a new molecular
  pathway acting through the Met5-enkephalin / opioid growth factor receptor signalling axis. Its
  oncology pipeline includes ZetaMet (Zeta-BC-003) for metastatic breast cancer to bone, which
  received FDA Breakthrough Device Designation in December 2021 and Health Canada authorisation for
  a Phase 2a study in January 2022 and reported Phase 2a results at ASCO in June 2026; ZetaMet-P
  (Zeta-PC-004) for prostate cancer; ZetaMAST (Zeta-MBC-005) for metastatic breast cancer in liver;
  Zeta-BC-007; and ZetaOnc. Its osteologic programme is ZetaFuse, a synthetic osteoinductive bone
  graft studied in anterior cervical discectomy and fusion. The company reached 64 worldwide patents
  in 2024, has been funded by NCI and NIAMS grants, a $5.34M Series A, a $9.79M Series B and an
  oversubscribed Series B1 closed in November 2025, and its shares trade on secondary markets.
  Zetagen Therapeutics runs no developer program and publishes no product API, developer portal or
  API documentation. The only machine-readable surface reachable without credentials is the
  WordPress REST content API behind zetagen.com, catalogued here.
