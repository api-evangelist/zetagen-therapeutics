apis:
- aid: zetagen-therapeutics:zetagen-therapeutics-content-api
  name: Zetagen Therapeutics Content API
  description: >-
    The anonymously readable WordPress REST API behind zetagen.com. It exposes the 32 published
    posts — 26 press releases spanning the company's 2018 NCI grant through the June 2026 ASCO
    Phase 2a presentation, plus 6 peer-reviewed publication entries — the 25 published corporate
    pages (Home, Our Company, The Science, Research Overview, Oncology, Regulatory Status, Clinical
    Trials, Expanded Access Policy, Publications, Press Releases, News, Contact Us, Walk With You
    and the regional privacy/cookie notices), the 388-item media library, the three post
    categories, the registered post types, taxonomies and statuses, cross-content search, the
    oEmbed 1.0 provider endpoint, the Yoast SEO head endpoint and the WP Download Manager search
    endpoint. This is not a developer product Zetagen markets; it is the site's own content surface,
    registered at /wp-json/ and verified to return data without credentials. The OpenAPI in this
    repo is derived from the published route index.
  humanURL: https://developer.wordpress.org/rest-api/
  baseURL: https://zetagen.com/wp-json
