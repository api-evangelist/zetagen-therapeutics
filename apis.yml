  x-contract-provenance: >-
    Derived by the API Evangelist enrichment pipeline from the WordPress REST route index the site
    publishes at https://zetagen.com/wp-json/ — 349 routes across 17 namespaces including
    oembed/1.0, wp/v2, wp-site-health/v1, wp-block-editor/v1, wp-abilities/v1, yoast/v1,
    redirection/v1, complianz/v1, code-snippets/v1, akismet/v1, ithemes-security/v1,
    ithemes-security/rpc, oxygen-vsb-connection/v1, post-duplicator/v1,
    MtphrPostDuplicatorSettings/v1, omgf/v1 and wpdm — and verified against live anonymous responses
    on 2026-08-05. Only operations that returned data without credentials are modelled; every
    write route and the entire plugin-administration surface is excluded. Anonymous 401s recorded at
    harvest: /wp/v2/settings (rest_forbidden), /wp/v2/menus (rest_cannot_view), /wp/v2/themes,
    /wp/v2/plugins, /wp/v2/block-types, /wp/v2/block-patterns/categories, /wp/v2/font-collections,
    /wp-site-health/v1/*, /redirection/v1/*, /code-snippets/v1/*, /akismet/v1/* and every
    wp-abilities/v1 route. The site registers the WordPress Abilities API (wp-abilities/v1), the
    agent-facing capability registry, but /wp-abilities/v1/abilities and /wp-abilities/v1/categories
    both returned 401 rest_forbidden anonymously, so no MCP or agent surface is claimed for this
    provider and no MCPServer pointer is emitted. The site is served by LiteSpeed with HTTP/3
    advertised and sets x-robots-tag: noindex on API responses. Zetagen publishes no developer
    documentation, no API reference, no getting-started guide and no support channel for this
    surface, so no Documentation / APIReference / GettingStarted pointers are emitted; the humanURL
    above is the upstream WordPress REST handbook that defines the wp/v2 contract.
