regulatory_context:
  note: >-
    Zetagen Therapeutics is a private, clinical-stage biopharmaceutical company. It is subject to
    FDA and Health Canada regulation of its investigational products — ZetaMet (Zeta-BC-003) holds
    FDA Breakthrough Device Designation granted in December 2021 and Health Canada authorisation for
    a Phase 2a study granted in January 2022, and ZetaFuse was cleared by an Australian Human
    Research Ethics Committee for a pilot study in November 2023 — but that is medical-product
    regulation, not API or data-processing regulation, and it confers nothing on the public content
    API catalogued here. The site publishes regional privacy statements and cookie policies for the
    US, EU and Canada (Complianz-managed, with a /opt-out-preferences/ consent surface), an
    Expanded Access Policy required of clinical-stage sponsors, and a Disclaimer; none of them
    describe an API, a data-processing agreement or a compliance certification. No HIPAA, GDPR
    certification, SOC 2 or ISO 27001 claim is published anywhere on the public surface, and none is
    asserted on the company's behalf.
