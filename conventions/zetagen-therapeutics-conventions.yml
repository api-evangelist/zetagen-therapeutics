generated: '2026-08-05'
method: derived
source: >-
  openapi/zetagen-therapeutics-content-openapi.yml + live response headers observed on
  https://zetagen.com/wp-json on 2026-08-05
note: >-
  Cross-cutting request/response semantics of the Zetagen Therapeutics content API. Zetagen
  publishes no API conventions documentation of its own; everything below is the WordPress REST
  contract as it is actually deployed here, derived from the route index and confirmed against live
  anonymous responses. Idempotency is deliberately NOT claimed — this deployment exposes no
  idempotency key, no request-deduplication contract and no anonymous write surface at all, so no
  `Idempotency` pointer is emitted in apis.yml.
authentication:
  style: none
  detail: >-
    No credentials required for any catalogued operation. The /wp-json/ index registers WordPress
    application passwords (HTTP Basic) for the site's own operators, which is not a third-party
    developer credential. See authentication/zetagen-therapeutics-authentication.yml.
idempotency:
  supported: false
  header: null
  detail: >-
    No Idempotency-Key header, no client-supplied request identifier and no documented replay
    semantics. All catalogued operations are GET and therefore idempotent by HTTP method alone,
    which is not an idempotency contract.
pagination:
  style: page-number
  params:
    page: Current page of the collection, 1-based.
    per_page: Items per page. Minimum 1, maximum 100, default 10.
    offset: Alternative absolute offset into the result set.
  response_headers:
    X-WP-Total: Total number of matching items. Observed 32 on posts, 25 on pages, 388 on media, 57 on search.
    X-WP-TotalPages: Total number of pages available.
  link_header: >-
    RFC 8288 Link header carrying rel="next" and rel="prev". Observed on /wp/v2/posts?per_page=2 as
    <https://zetagen.com/wp-json/wp/v2/posts?per_page=2&page=2>; rel="next".
  cors_exposure: >-
    Access-Control-Expose-Headers advertises X-WP-Total, X-WP-TotalPages and Link, so browser
    clients can read the pagination headers cross-origin.
  bounds_error: >-
    per_page above 100 returns 400 rest_invalid_param with a per-parameter `params` map and a
    machine-readable `details` block (rest_out_of_bounds), not a clamp.
field_selection:
  supported: true
  params:
    _fields: Comma-separated allow-list of top-level response fields.
    _embed: Inline embeddable resources (author, featured media, terms) under _embedded.
    _envelope: Wrap the response body, status and headers in a single JSON envelope.
  context:
    param: context
    values: [view, embed, edit]
    detail: >-
      Anonymously only `view` and `embed` return data; `edit` requires an authenticated user and
      returns 401.
sorting_and_filtering:
  order: asc | desc (default desc)
  orderby: Per-collection enum — date, id, title, slug, modified, author, include, relevance, menu_order.
  date_windows: after, before, modified_after, modified_before (ISO 8601).
  identity: include / exclude / slug.
  full_text: search, plus a dedicated federated /wp/v2/search collection returning stub records.
  taxonomy: categories, categories_exclude, tags, tags_exclude.
metadata:
  field: meta
  detail: >-
    A `meta` object is present on every post-like resource but only registered meta keys are
    exposed. The only key observed anonymously on this deployment is `_acf_changed`.
  extensions_observed:
  - acf — an Advanced Custom Fields payload registered on posts, pages and attachments. Present on
    every object but empty on everything sampled at harvest, so no custom field data is exposed.
  - yoast_head and yoast_head_json — rendered and structured Yoast SEO metadata, including a
    schema.org @graph, inlined on every post and page. The same payload is separately addressable
    for any URL at /yoast/v1/get_head.
  - class_list — the CSS class list WordPress would render for the object.
  - media_details.sizes.cmplz_banner_image — a Complianz cookie-banner image rendition generated
    alongside the standard WordPress sizes.
request_tracing:
  request_id_header: null
  detail: >-
    No provider request identifier and no edge trace token — this origin is LiteSpeed served
    directly, with no CDN ray id on the response. There is a __wpdm_client cookie set by WP Download
    Manager on every /wp-json response, which is a plugin session token, not a correlation id.
versioning:
  scheme: uri-path-namespace
  current: wp/v2
  detail: >-
    Version is carried in the route namespace (wp/v2, oembed/1.0, yoast/v1, complianz/v1, wpdm).
    Zetagen does not version this surface itself; it moves when WordPress core and the installed
    plugins move. See lifecycle/zetagen-therapeutics-lifecycle.yml.
error_envelope:
  format: wordpress-rest
  rfc9457: false
  content_type: application/json
  shape: '{ code: string, message: string, data: { status: int, params?: object, details?: object } }'
  detail: >-
    Not RFC 9457 problem+json — there is no `type` URI and no problem+json media type. See
    errors/zetagen-therapeutics-problem-types.yml.
rate_limiting:
  signaled: false
  headers: []
  detail: >-
    No RateLimit-* or X-RateLimit-* headers are returned on /wp-json responses, and no throttling
    was observed across roughly 60 probe requests during this pass. robots.txt sets no Crawl-delay.
    The site runs iThemes Security (ithemes-security/v1 + ithemes-security/rpc namespaces are
    registered), so an unsignalled lockout threshold may exist for authenticated endpoints, but none
    was exercised.
caching:
  cache_control: none advertised on /wp-json responses
  headers_observed: [x-robots-tag, x-content-type-options, vary, alt-svc, allow]
  detail: >-
    No Cache-Control, ETag or Last-Modified on API responses — every request reaches the origin.
    LiteSpeed serves directly with no CDN in front, and advertises HTTP/3 via alt-svc.
cors:
  allow_headers: [Authorization, X-WP-Nonce, Content-Disposition, Content-MD5, Content-Type, X-HTTP-Method-Override]
  expose_headers: [X-WP-Total, X-WP-TotalPages, Link]
  vary: Origin
  detail: >-
    X-HTTP-Method-Override is accepted, which is the WordPress method-tunnelling convention for
    clients that cannot issue PUT/DELETE.
robots:
  api_responses: 'x-robots-tag: noindex on every /wp-json response'
  site: >-
    robots.txt allows all user agents with no crawl delay and carries no AI-agent directives
    (no GPTBot, ClaudeBot, CCBot or Google-Extended rules).
cross_links:
  authentication: authentication/zetagen-therapeutics-authentication.yml
  errors: errors/zetagen-therapeutics-problem-types.yml
  lifecycle: lifecycle/zetagen-therapeutics-lifecycle.yml
  data_model: data-model/zetagen-therapeutics-data-model.yml
  conformance: conformance/zetagen-therapeutics-conformance.yml
  domain_security: security/zetagen-therapeutics-domain-security.yml
