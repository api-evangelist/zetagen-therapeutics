note: >-
  Zetagen Therapeutics runs no developer program, so it publishes no API versioning policy, no
  deprecation policy, no SLA and no status page. Nothing below is asserted on the company's behalf.
  No `StatusPage` and no `Deprecation` pointer is emitted in apis.yml, because neither exists — the
  operational-transparency checks those pointers feed would be false credit here.
