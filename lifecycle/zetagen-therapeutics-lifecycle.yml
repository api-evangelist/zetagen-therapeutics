  docs: https://developer.wordpress.org/rest-api/
  provider_policy: null
  detail: >-
    The version lives in the route namespace and is set by WordPress core and the installed plugins,
    not by Zetagen. Namespaces observed on 2026-08-05 - ithemes-security/rpc, ithemes-security/v1,
    oembed/1.0, akismet/v1, code-snippets/v1, wpdm, omgf/v1, oxygen-vsb-connection/v1,
    post-duplicator/v1, MtphrPostDuplicatorSettings/v1, redirection/v1, yoast/v1, complianz/v1,
    wp/v2, wp-site-health/v1, wp-block-editor/v1 and wp-abilities/v1. A plugin update can add,
    change or remove routes at any time with no notice to consumers.
