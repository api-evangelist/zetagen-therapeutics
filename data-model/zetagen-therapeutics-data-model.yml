  detail: 'post -> [category, post_tag]; page -> []; attachment -> [].'
embedded_structures:
- entity: Attachment
  field: media_details.sizes
  kind: map
  detail: >-
    Generated renditions keyed by size name — medium, thumbnail, cmplz_banner_image (a Complianz
    cookie-banner crop) and full — each with file, width, height, filesize, mime_type and
    source_url. A client can select a rendition without a second call.
- entity: Post / Page
  field: yoast_head_json.schema['@graph']
  kind: schema.org graph
  detail: >-
    A JSON-LD graph inlined on every post and page carrying WebPage, WebSite, Organization,
    BreadcrumbList and Article nodes. The Organization node is the machine-readable identity record
    for Zetagen — name, url and a 638x152 logo ImageObject. It carries no sameAs, address, email or
    telephone, so there is no structured contact data on the public surface.
- entity: Post / Page / Attachment
  field: acf
  kind: Advanced Custom Fields payload
  detail: Registered on every post-like object but empty on everything sampled at harvest.
traversal_notes:
  detail: >-
    /wp/v2/search is the entry point for cross-entity lookup — it returns lightweight stubs (id,
    title, url, type, subtype) with a _links.self pointing at the full object, so an agent should
    search, then dereference. Every object carries a _links.collection back to its own collection
    and a _links.about to its /wp/v2/types entry, which makes the graph fully self-describing from
    any single record.
