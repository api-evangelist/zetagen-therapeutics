openapi: 3.1.0
info:
  title: Zetagen Therapeutics Content API
  version: wp/v2
  summary: The anonymously readable WordPress REST content API behind zetagen.com.
  description: >-
    Zetagen Therapeutics runs no developer program and publishes no OpenAPI. This document is an
    API Evangelist derivation of the WordPress REST route index the site publishes at
    https://zetagen.com/wp-json/ (349 routes across 17 namespaces), narrowed to the operations that
    were verified to return data anonymously on 2026-08-05. Every write route and the entire
    plugin-administration surface is excluded — those require an authenticated WordPress user and
    were never exercised. The contract semantics (pagination, field selection, error envelope) are
    upstream WordPress REST behaviour, documented at https://developer.wordpress.org/rest-api/.
  contact:
    name: Zetagen Therapeutics
    url: https://zetagen.com/contact-us/
  x-provenance:
    method: derived
    generated: '2026-08-05'
    source: https://zetagen.com/wp-json/
    verified_against: live anonymous GET responses on 2026-08-05
    publisher: API Evangelist
    note: >-
      Not published by Zetagen Therapeutics. Derived and independently verified; no operation here
      was invented and every one returned 200 anonymously at harvest.
externalDocs:
  description: WordPress REST API Handbook — the upstream contract this deployment implements
  url: https://developer.wordpress.org/rest-api/
servers:
- url: https://zetagen.com/wp-json
  description: Production
tags:
- name: discovery
  description: Route index, registered types, taxonomies and statuses.
- name: content
  description: Posts, pages and the block library.
- name: media
  description: The 388-item media library.
- name: taxonomy
  description: Categories and tags.
- name: search
  description: Cross-content search.
- name: embed
  description: oEmbed 1.0 provider.
- name: seo
  description: Yoast SEO head metadata.
- name: downloads
  description: WP Download Manager public search.
- name: people
  description: >-
    Author records. Personal data — see x-personal-data. Documented for completeness; deliberately
    excluded from every packaged Agent Skill in this repo.
paths:
  /:
    get:
      operationId: getRouteIndex
      tags: [discovery]
      summary: Get the REST route index
      description: >-
        Returns the site name, description, URLs, registered namespaces, the full route table and
        the authentication providers registered for discovery. This deployment reports application
        passwords as the only registered authentication provider, with its authorization endpoint at
        /wp-admin/authorize-application.php.
      parameters:
      - $ref: '#/components/parameters/Context'
      - name: namespace
        in: query
        description: Restrict the index to a single namespace.
        schema: {type: string}
      responses:
        '200':
          description: The route index.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RouteIndex'}
  /wp/v2/posts:
    get:
      operationId: listPosts
      tags: [content]
      summary: List posts
      description: >-
        The 32 published posts — 26 in the press-release category and 6 in publications — spanning
        2018-09-05 to 2026-06-09. Collection responses carry X-WP-Total and X-WP-TotalPages and an
        RFC 8288 Link header.
      parameters:
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/After'
      - $ref: '#/components/parameters/Before'
      - $ref: '#/components/parameters/ModifiedAfter'
      - $ref: '#/components/parameters/ModifiedBefore'
      - $ref: '#/components/parameters/Include'
      - $ref: '#/components/parameters/Exclude'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Order'
      - name: orderby
        in: query
        schema:
          type: string
          enum: [author, date, id, include, modified, parent, relevance, slug, include_slugs, title]
          default: date
      - $ref: '#/components/parameters/Slug'
      - name: categories
        in: query
        description: Limit to posts assigned to these category term ids.
        schema: {type: array, items: {type: integer}}
      - name: categories_exclude
        in: query
        schema: {type: array, items: {type: integer}}
      - name: tags
        in: query
        schema: {type: array, items: {type: integer}}
      - name: tags_exclude
        in: query
        schema: {type: array, items: {type: integer}}
      - name: sticky
        in: query
        schema: {type: boolean}
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Embed'
      responses:
        '200':
          description: A page of posts.
          headers:
            X-WP-Total: {$ref: '#/components/headers/XWPTotal'}
            X-WP-TotalPages: {$ref: '#/components/headers/XWPTotalPages'}
            Link: {$ref: '#/components/headers/LinkPagination'}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Post'}}
        '400': {$ref: '#/components/responses/InvalidParam'}
  /wp/v2/posts/{id}:
    get:
      operationId: getPost
      tags: [content]
      summary: Get a post by id
      parameters:
      - $ref: '#/components/parameters/PathId'
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Embed'
      responses:
        '200':
          description: A post.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Post'}
        '404': {$ref: '#/components/responses/PostNotFound'}
  /wp/v2/pages:
    get:
      operationId: listPages
      tags: [content]
      summary: List pages
      description: >-
        The 25 published corporate pages, including the hierarchical Research Overview and News
        branches. Pages carry a parent id and a menu_order.
      parameters:
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/Include'
      - $ref: '#/components/parameters/Exclude'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Order'
      - name: orderby
        in: query
        schema:
          type: string
          enum: [author, date, id, include, modified, parent, relevance, slug, include_slugs, title, menu_order]
          default: date
      - name: parent
        in: query
        schema: {type: array, items: {type: integer}}
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Embed'
      responses:
        '200':
          description: A page of pages.
          headers:
            X-WP-Total: {$ref: '#/components/headers/XWPTotal'}
            X-WP-TotalPages: {$ref: '#/components/headers/XWPTotalPages'}
            Link: {$ref: '#/components/headers/LinkPagination'}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Page'}}
        '400': {$ref: '#/components/responses/InvalidParam'}
  /wp/v2/pages/{id}:
    get:
      operationId: getPage
      tags: [content]
      summary: Get a page by id
      parameters:
      - $ref: '#/components/parameters/PathId'
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Embed'
      responses:
        '200':
          description: A page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Page'}
        '404': {$ref: '#/components/responses/PostNotFound'}
  /wp/v2/media:
    get:
      operationId: listMedia
      tags: [media]
      summary: List media items
      description: >-
        The 388-item media library. Each attachment carries source_url plus a media_details.sizes
        map of every generated derivative, so a client can select a rendition without a second call.
      parameters:
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/Include'
      - $ref: '#/components/parameters/Exclude'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Order'
      - name: media_type
        in: query
        schema: {type: string, enum: [image, video, text, application, audio]}
      - name: mime_type
        in: query
        schema: {type: string}
      - name: parent
        in: query
        schema: {type: array, items: {type: integer}}
      - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: A page of attachments.
          headers:
            X-WP-Total: {$ref: '#/components/headers/XWPTotal'}
            X-WP-TotalPages: {$ref: '#/components/headers/XWPTotalPages'}
            Link: {$ref: '#/components/headers/LinkPagination'}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Attachment'}}
        '400': {$ref: '#/components/responses/InvalidParam'}
  /wp/v2/media/{id}:
    get:
      operationId: getMediaItem
      tags: [media]
      summary: Get a media item by id
      parameters:
      - $ref: '#/components/parameters/PathId'
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: An attachment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Attachment'}
        '404': {$ref: '#/components/responses/PostNotFound'}
  /wp/v2/categories:
    get:
      operationId: listCategories
      tags: [taxonomy]
      summary: List categories
      description: >-
        Three terms are registered on this site — press-release (26 posts), publications (6 posts)
        and uncategorized (0 posts).
      parameters:
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/Order'
      - name: orderby
        in: query
        schema: {type: string, enum: [id, include, name, slug, include_slugs, term_group, description, count], default: name}
      - name: hide_empty
        in: query
        schema: {type: boolean, default: false}
      - name: post
        in: query
        description: Limit to terms assigned to a specific post.
        schema: {type: integer}
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: A page of category terms.
          headers:
            X-WP-Total: {$ref: '#/components/headers/XWPTotal'}
            X-WP-TotalPages: {$ref: '#/components/headers/XWPTotalPages'}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Term'}}
        '400': {$ref: '#/components/responses/InvalidParam'}
  /wp/v2/categories/{id}:
    get:
      operationId: getCategory
      tags: [taxonomy]
      summary: Get a category term by id
      parameters:
      - $ref: '#/components/parameters/PathId'
      - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: A category term.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Term'}
        '404': {$ref: '#/components/responses/TermNotFound'}
  /wp/v2/tags:
    get:
      operationId: listTags
      tags: [taxonomy]
      summary: List post tags
      parameters:
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: A page of tag terms.
          headers:
            X-WP-Total: {$ref: '#/components/headers/XWPTotal'}
            X-WP-TotalPages: {$ref: '#/components/headers/XWPTotalPages'}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Term'}}
        '400': {$ref: '#/components/responses/InvalidParam'}
  /wp/v2/tags/{id}:
    get:
      operationId: getTag
      tags: [taxonomy]
      summary: Get a tag term by id
      parameters:
      - $ref: '#/components/parameters/PathId'
      - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: A tag term.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Term'}
        '404': {$ref: '#/components/responses/TermNotFound'}
  /wp/v2/comments:
    get:
      operationId: listComments
      tags: [content]
      summary: List comments
      description: >-
        Registered and anonymously readable, but empty — X-WP-Total was 0 at harvest. Comments are
        closed on the published content.
      parameters:
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - name: post
        in: query
        schema: {type: array, items: {type: integer}}
      - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: A page of comments.
          headers:
            X-WP-Total: {$ref: '#/components/headers/XWPTotal'}
          content:
            application/json:
              schema: {type: array, items: {type: object}}
  /wp/v2/blocks:
    get:
      operationId: listBlocks
      tags: [content]
      summary: List reusable blocks (patterns)
      description: Registered and anonymously readable; returned an empty array at harvest.
      parameters:
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of reusable blocks.
          content:
            application/json:
              schema: {type: array, items: {type: object}}
  /wp/v2/search:
    get:
      operationId: search
      tags: [search]
      summary: Cross-content search
      description: >-
        Federated search across searchable post types. Returned 57 total results for an empty query
        at harvest. Results are lightweight stubs — id, title, url, type, subtype — with _links to
        the full object.
      parameters:
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Search'
      - name: type
        in: query
        schema: {type: string, enum: [post, term, post-format], default: post}
      - name: subtype
        in: query
        schema: {type: array, items: {type: string}}
      responses:
        '200':
          description: A page of search results.
          headers:
            X-WP-Total: {$ref: '#/components/headers/XWPTotal'}
            X-WP-TotalPages: {$ref: '#/components/headers/XWPTotalPages'}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SearchResult'}}
  /wp/v2/types:
    get:
      operationId: listTypes
      tags: [discovery]
      summary: List registered post types
      description: >-
        Eleven types are registered — post, page, attachment, nav_menu_item, wp_block, wp_template,
        wp_template_part, wp_global_styles, wp_navigation, wp_font_family, wp_font_face. No custom
        post type is registered on this deployment; press releases and publications are ordinary
        posts separated by category.
      parameters:
      - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: A map of post type objects keyed by type name.
          content:
            application/json:
              schema: {type: object, additionalProperties: {$ref: '#/components/schemas/PostType'}}
  /wp/v2/types/{type}:
    get:
      operationId: getType
      tags: [discovery]
      summary: Get a registered post type
      parameters:
      - name: type
        in: path
        required: true
        schema: {type: string}
      - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: A post type object.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostType'}
        '404': {$ref: '#/components/responses/NoRoute'}
  /wp/v2/taxonomies:
    get:
      operationId: listTaxonomies
      tags: [discovery]
      summary: List registered taxonomies
      description: Four taxonomies — category, post_tag, nav_menu, wp_pattern_category.
      parameters:
      - $ref: '#/components/parameters/Context'
      - name: type
        in: query
        description: Restrict to taxonomies attached to a post type.
        schema: {type: string}
      responses:
        '200':
          description: A map of taxonomy objects keyed by taxonomy name.
          content:
            application/json:
              schema: {type: object, additionalProperties: {$ref: '#/components/schemas/Taxonomy'}}
  /wp/v2/taxonomies/{taxonomy}:
    get:
      operationId: getTaxonomy
      tags: [discovery]
      summary: Get a registered taxonomy
      parameters:
      - name: taxonomy
        in: path
        required: true
        schema: {type: string}
      - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: A taxonomy object.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Taxonomy'}
        '404': {$ref: '#/components/responses/NoRoute'}
  /wp/v2/statuses:
    get:
      operationId: listStatuses
      tags: [discovery]
      summary: List post statuses
      description: Anonymously only the publicly queryable statuses are returned.
      parameters:
      - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: A map of status objects keyed by status name.
          content:
            application/json:
              schema: {type: object, additionalProperties: {type: object}}
  /wp/v2/statuses/{status}:
    get:
      operationId: getStatus
      tags: [discovery]
      summary: Get a post status
      parameters:
      - name: status
        in: path
        required: true
        schema: {type: string}
      - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: A status object.
          content:
            application/json:
              schema: {type: object}
        '404': {$ref: '#/components/responses/NoRoute'}
  /wp/v2/users:
    get:
      operationId: listUsers
      tags: [people]
      summary: List site authors
      description: >-
        Returned 200 anonymously with X-WP-Total 4 at harvest. This is the standard WordPress author
        collection; it exposes author display names, slugs, descriptions and avatar URLs (not email
        addresses) without credentials. Documented here for completeness of the contract only — no
        response data was captured, no example is provided, and this operation is deliberately
        excluded from every packaged Agent Skill in this repo. See review.yml.
      parameters:
      - $ref: '#/components/parameters/Context'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: A page of author records.
          headers:
            X-WP-Total: {$ref: '#/components/headers/XWPTotal'}
          content:
            application/json:
              schema: {type: array, items: {type: object}}
      x-personal-data: true
      x-agentic-access:
        action-class: connected
        consequence: read
        note: >-
          Personal data. Excluded from skills and from any derived tool surface under the API
          Evangelist enrichment PII guardrail.
  /oembed/1.0/embed:
    get:
      operationId: getOembed
      tags: [embed]
      summary: oEmbed 1.0 provider endpoint
      description: Returns an oEmbed 1.0 rich response for any URL on zetagen.com.
      parameters:
      - name: url
        in: query
        required: true
        schema: {type: string, format: uri}
      - name: format
        in: query
        schema: {type: string, enum: [json, xml], default: json}
      - name: maxwidth
        in: query
        schema: {type: integer, default: 600}
      responses:
        '200':
          description: An oEmbed 1.0 response.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Oembed'}
        '404': {$ref: '#/components/responses/NoRoute'}
  /yoast/v1/get_head:
    get:
      operationId: getYoastHead
      tags: [seo]
      summary: Get rendered SEO head metadata for a URL
      description: >-
        Yoast SEO exposes the rendered <head> block and its structured schema.org graph for any
        public URL on the site. Anonymously readable at harvest. The same payload is inlined on
        every post and page as yoast_head / yoast_head_json.
      parameters:
      - name: url
        in: query
        required: true
        schema: {type: string, format: uri}
      responses:
        '200':
          description: Rendered head metadata plus a schema.org graph.
          content:
            application/json:
              schema:
                type: object
                properties:
                  html: {type: string}
                  json: {type: object}
        '404': {$ref: '#/components/responses/NoRoute'}
  /wpdm/search:
    get:
      operationId: searchDownloads
      tags: [downloads]
      summary: Search the WP Download Manager package index
      description: >-
        The public read route of the WP Download Manager plugin. Registered and anonymously
        reachable; the other wpdm routes (validate-captcha, validate-password, view-count) are POST
        and are not modelled.
      parameters:
      - name: s
        in: query
        schema: {type: string}
      responses:
        '200':
          description: Matching download packages.
          content:
            application/json:
              schema: {type: array, items: {type: object}}
components:
  parameters:
    Context:
      name: context
      in: query
      description: >-
        Response shape. Anonymously only `view` and `embed` return data; `edit` requires an
        authenticated user and returns 401.
      schema: {type: string, enum: [view, embed, edit], default: view}
    Page:
      name: page
      in: query
      description: Current page of the collection, 1-based.
      schema: {type: integer, minimum: 1, default: 1}
    PerPage:
      name: per_page
      in: query
      description: Items per page. Values above 100 return 400 rest_invalid_param, not a clamp.
      schema: {type: integer, minimum: 1, maximum: 100, default: 10}
    Offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0}
    Search:
      name: search
      in: query
      schema: {type: string}
    Slug:
      name: slug
      in: query
      schema: {type: array, items: {type: string}}
    Include:
      name: include
      in: query
      schema: {type: array, items: {type: integer}}
    Exclude:
      name: exclude
      in: query
      schema: {type: array, items: {type: integer}}
    Order:
      name: order
      in: query
      schema: {type: string, enum: [asc, desc], default: desc}
    After:
      name: after
      in: query
      schema: {type: string, format: date-time}
    Before:
      name: before
      in: query
      schema: {type: string, format: date-time}
    ModifiedAfter:
      name: modified_after
      in: query
      schema: {type: string, format: date-time}
    ModifiedBefore:
      name: modified_before
      in: query
      schema: {type: string, format: date-time}
    Fields:
      name: _fields
      in: query
      description: Comma-separated allow-list of top-level response fields.
      schema: {type: string}
    Embed:
      name: _embed
      in: query
      description: Inline embeddable resources (author, featured media, terms) under _embedded.
      schema: {type: boolean}
    PathId:
      name: id
      in: path
      required: true
      schema: {type: integer}
  headers:
    XWPTotal:
      description: Total number of matching items.
      schema: {type: integer}
    XWPTotalPages:
      description: Total number of pages available.
      schema: {type: integer}
    LinkPagination:
      description: RFC 8288 Link header carrying rel="next" and rel="prev".
      schema: {type: string}
  responses:
    InvalidParam:
      description: A query parameter failed validation.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            perPageOutOfBounds:
              summary: per_page above the 100 maximum
              value:
                code: rest_invalid_param
                message: 'Invalid parameter(s): per_page'
                data:
                  status: 400
                  params:
                    per_page: per_page must be between 1 (inclusive) and 100 (inclusive)
    PostNotFound:
      description: No object with that id.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            invalidPostId:
              value:
                code: rest_post_invalid_id
                message: Invalid post ID.
                data: {status: 404}
    TermNotFound:
      description: No term with that id.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            invalidTermId:
              value:
                code: rest_term_invalid
                message: Term does not exist.
                data: {status: 404}
    NoRoute:
      description: No route matched the URL and method.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            noRoute:
              value:
                code: rest_no_route
                message: No route was found matching the URL and request method.
                data: {status: 404}
  schemas:
    Error:
      type: object
      description: >-
        The WordPress REST error envelope. Not RFC 9457 — no type URI and no application/problem+json
        media type.
      required: [code, message, data]
      properties:
        code: {type: string, description: Machine-readable error slug.}
        message: {type: string}
        data:
          type: object
          properties:
            status: {type: integer}
            params: {type: object, additionalProperties: {type: string}}
            details: {type: object}
    RenderedText:
      type: object
      properties:
        rendered: {type: string}
        protected: {type: boolean}
    Links:
      type: object
      description: HAL-style link relations — self, collection, about, author, replies, wp:term, wp:featuredmedia, wp:attachment, curies.
      additionalProperties: true
    Post:
      type: object
      description: A published post. This site uses posts for both press releases and publications, separated by category.
      properties:
        id: {type: integer}
        date: {type: string, format: date-time, description: Site-local publication time (America/Toronto, UTC-4).}
        date_gmt: {type: string, format: date-time}
        modified: {type: string, format: date-time}
        modified_gmt: {type: string, format: date-time}
        guid: {$ref: '#/components/schemas/RenderedText'}
        slug: {type: string}
        status: {type: string}
        type: {type: string, const: post}
        link: {type: string, format: uri}
        title: {$ref: '#/components/schemas/RenderedText'}
        content: {$ref: '#/components/schemas/RenderedText'}
        excerpt: {$ref: '#/components/schemas/RenderedText'}
        author: {type: integer, description: Author id. See the people tag note on /wp/v2/users.}
        featured_media: {type: integer, description: Attachment id, 0 when unset.}
        comment_status: {type: string}
        ping_status: {type: string}
        sticky: {type: boolean}
        template: {type: string}
        format: {type: string}
        categories: {type: array, items: {type: integer}}
        tags: {type: array, items: {type: integer}}
        meta: {type: object, description: Registered meta only. Observed key on this deployment - _acf_changed.}
        acf:
          description: >-
            Advanced Custom Fields payload. Registered and exposed on every post-like object; empty
            on the objects sampled at harvest.
          oneOf: [{type: object}, {type: array}]
        class_list: {type: array, items: {type: string}}
        yoast_head: {type: string, description: Rendered SEO head markup inlined by Yoast SEO.}
        yoast_head_json: {type: object, description: Structured SEO metadata including a schema.org @graph.}
        _links: {$ref: '#/components/schemas/Links'}
    Page:
      type: object
      description: A published corporate page. Pages are hierarchical on this site.
      properties:
        id: {type: integer}
        date: {type: string, format: date-time}
        modified: {type: string, format: date-time}
        guid: {$ref: '#/components/schemas/RenderedText'}
        slug: {type: string}
        status: {type: string}
        type: {type: string, const: page}
        link: {type: string, format: uri}
        title: {$ref: '#/components/schemas/RenderedText'}
        content: {$ref: '#/components/schemas/RenderedText'}
        excerpt: {$ref: '#/components/schemas/RenderedText'}
        author: {type: integer}
        featured_media: {type: integer}
        parent: {type: integer, description: Parent page id, 0 at the root.}
        menu_order: {type: integer}
        template: {type: string}
        meta: {type: object}
        acf:
          oneOf: [{type: object}, {type: array}]
        class_list: {type: array, items: {type: string}}
        yoast_head: {type: string}
        yoast_head_json: {type: object}
        _links: {$ref: '#/components/schemas/Links'}
    Attachment:
      type: object
      description: A media library item.
      properties:
        id: {type: integer}
        date: {type: string, format: date-time}
        modified: {type: string, format: date-time}
        guid: {$ref: '#/components/schemas/RenderedText'}
        slug: {type: string}
        status: {type: string, const: inherit}
        type: {type: string, const: attachment}
        link: {type: string, format: uri}
        title: {$ref: '#/components/schemas/RenderedText'}
        author: {type: integer}
        description: {$ref: '#/components/schemas/RenderedText'}
        caption: {$ref: '#/components/schemas/RenderedText'}
        alt_text: {type: string}
        media_type: {type: string, enum: [image, file]}
        mime_type: {type: string}
        source_url: {type: string, format: uri}
        post: {type: [integer, 'null'], description: Id of the object this attachment is attached to.}
        media_details: {$ref: '#/components/schemas/MediaDetails'}
        meta: {type: object}
        class_list: {type: array, items: {type: string}}
        _links: {$ref: '#/components/schemas/Links'}
    MediaDetails:
      type: object
      properties:
        width: {type: integer}
        height: {type: integer}
        file: {type: string}
        filesize: {type: integer}
        image_meta: {type: object}
        sizes:
          type: object
          description: >-
            Generated renditions keyed by size name. Observed on this deployment - medium,
            thumbnail, cmplz_banner_image (a Complianz cookie-banner rendition) and full.
          additionalProperties:
            type: object
            properties:
              file: {type: string}
              width: {type: integer}
              height: {type: integer}
              filesize: {type: integer}
              mime_type: {type: string}
              source_url: {type: string, format: uri}
    Term:
      type: object
      description: A taxonomy term.
      properties:
        id: {type: integer}
        count: {type: integer}
        description: {type: string}
        link: {type: string, format: uri}
        name: {type: string}
        slug: {type: string}
        taxonomy: {type: string}
        parent: {type: integer}
        meta: {type: object}
        _links: {$ref: '#/components/schemas/Links'}
    SearchResult:
      type: object
      properties:
        id: {type: integer}
        title: {type: string}
        url: {type: string, format: uri}
        type: {type: string}
        subtype: {type: string}
        _links: {$ref: '#/components/schemas/Links'}
    PostType:
      type: object
      properties:
        name: {type: string}
        slug: {type: string}
        description: {type: string}
        hierarchical: {type: boolean}
        rest_base: {type: string}
        rest_namespace: {type: string}
        taxonomies: {type: array, items: {type: string}}
        icon: {type: [string, 'null']}
        _links: {$ref: '#/components/schemas/Links'}
    Taxonomy:
      type: object
      properties:
        name: {type: string}
        slug: {type: string}
        description: {type: string}
        hierarchical: {type: boolean}
        rest_base: {type: string}
        rest_namespace: {type: string}
        types: {type: array, items: {type: string}}
        _links: {$ref: '#/components/schemas/Links'}
    Oembed:
      type: object
      properties:
        version: {type: string}
        provider_name: {type: string}
        provider_url: {type: string, format: uri}
        author_name: {type: string}
        author_url: {type: string, format: uri}
        title: {type: string}
        type: {type: string}
        width: {type: integer}
        height: {type: [integer, 'null']}
        html: {type: string}
        thumbnail_url: {type: string, format: uri}
    RouteIndex:
      type: object
      properties:
        name: {type: string}
        description: {type: string}
        url: {type: string, format: uri}
        home: {type: string, format: uri}
        gmt_offset: {type: [number, string]}
        timezone_string: {type: string}
        namespaces: {type: array, items: {type: string}}
        authentication:
          type: object
          description: >-
            Registered authentication providers. This deployment reports application-passwords with
            an authorization endpoint at /wp-admin/authorize-application.php. No OAuth, no JWT.
        routes: {type: object, additionalProperties: true}
        site_icon_url: {type: string, format: uri}
        _links: {$ref: '#/components/schemas/Links'}
